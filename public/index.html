<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Calendar</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e3dc;
    --husain:#2563eb; --sarah:#db2777; --both:#059669; --accent:#1f2328;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181c; --card:#1f2228; --ink:#eceef1; --muted:#9aa1ab; --line:#2f333b; --accent:#eceef1; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .app{max-width:1100px;margin:0 auto;padding:16px}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
  h1{font-size:22px;margin:0}
  .nav{display:flex;gap:6px;align-items:center}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px}
  button:hover{border-color:var(--muted)}
  button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  button.danger{color:#dc2626}
  .month{font-size:18px;font-weight:600;min-width:180px;text-align:center;white-space:pre-line;line-height:1.2}
  .month{} 
  .legend{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-bottom:10px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  .layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
  @media(max-width:860px){.layout{grid-template-columns:1fr}}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dow{background:var(--card);padding:6px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
  .cell{background:var(--card);min-height:96px;padding:4px;cursor:pointer;overflow:hidden}
  .cell.other{opacity:.45}
  .cell:hover{background:color-mix(in srgb,var(--card) 92%,var(--ink))}
  .num{font-size:12px;color:var(--muted);display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%}
  .cell.today .num{background:var(--accent);color:var(--bg);font-weight:700}
  .ev{display:block;width:100%;text-align:left;margin-top:2px;padding:1px 5px;font-size:12px;border:0;border-radius:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev.Husain{background:var(--husain)} .ev.Sarah{background:var(--sarah)} .ev.Both{background:var(--both)}
  @media(max-width:600px){.cell{min-height:64px}.ev{font-size:10px;padding:0 3px}}
  aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start}
  aside h2{font-size:15px;margin:0 0 10px}
  .up{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
  .up:first-of-type{border-top:0}
  .up small{color:var(--muted);display:block}
  .empty{color:var(--muted)}
  dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(420px,94vw)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
  input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .actions .spacer{flex:1}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:8px 14px;border-radius:8px;display:none}
  .sync{font-size:12px;color:var(--muted)}
  .opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--muted)}
  .opts select{width:auto;padding:2px 6px}
  .opts label{display:inline-flex;gap:5px;align-items:center;margin:0;font-size:13px}
  .opts input{width:auto}
  .cellhead{display:flex;justify-content:space-between;align-items:center}
  .hj{font-size:10px;color:var(--muted);white-space:nowrap}
  .occ{display:block;margin-top:2px;padding:1px 5px;font-size:11px;border-radius:4px;border:1px dashed #b45309;color:#b45309;background:color-mix(in srgb,#f59e0b 14%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:600px){.hj{font-size:9px}.occ{font-size:9px;padding:0 3px}}
  .upocc{color:#b45309}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📅 Our Calendar</h1>
    <div class="nav">
      <button id="prev" aria-label="Previous month">‹</button>
      <div class="month" id="monthLabel"></div>
      <button id="next" aria-label="Next month">›</button>
      <button id="today">Today</button>
    </div>
    <button class="primary" id="add">+ Add event</button>
  </header>
  <div class="legend">
    <span><span class="dot" style="background:var(--husain)"></span>Husain</span>
    <span><span class="dot" style="background:var(--sarah)"></span>Sarah</span>
    <span><span class="dot" style="background:var(--both)"></span>Both</span>
    <span class="sync" id="sync"></span>
    <span class="opts">
      <label><input type="checkbox" id="hjOn"> Bohra (Hijri) dates</label>
      <label title="Shift Hijri dates by a day if your community calendar differs">Adjust
        <select id="hjAdj"><option value="-1">−1 day</option><option value="0">0</option><option value="1">+1 day</option></select></label>
    </span>
  </div>
  <div class="layout">
    <div class="grid" id="grid"></div>
    <aside><h2>Coming up</h2><div id="upcoming"></div></aside>
  </div>
</div>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2 style="margin-top:0">Enter passcode</h2>
    <p class="empty">Ask Husain or Sarah if you don't have it. It's saved on this device.</p>
    <input type="password" id="passInput" autocomplete="current-password" required>
    <div class="actions"><button class="primary">Open calendar</button></div>
  </form>
</dialog>

<dialog id="editor">
  <form id="evForm">
    <h2 style="margin-top:0" id="dlgTitle">New event</h2>
    <label>Title</label><input id="fTitle" required maxlength="120">
    <div class="row">
      <div><label>Start date</label><input type="date" id="fDate" required></div>
      <div><label>End date</label><input type="date" id="fEnd"></div>
    </div>
    <div class="row">
      <div><label>Start time (optional)</label><input type="time" id="fTime"></div>
      <div><label>End time (optional)</label><input type="time" id="fEndTime"></div>
    </div>
    <label>Who</label>
    <select id="fWho"><option>Both</option><option>Husain</option><option>Sarah</option></select>
    <label>Notes</label><textarea id="fNotes" rows="3" maxlength="1000"></textarea>
    <div class="actions">
      <button type="button" class="danger" id="del">Delete</button>
      <span class="spacer"></span>
      <button type="button" id="cancel">Cancel</button>
      <button class="primary" id="save">Save</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const API = "/api/events";
let events = [];
let view = new Date(); view.setDate(1);
let editingId = null;

// ---- Dawoodi Bohra (Fatimi / Misri) tabular Hijri calendar ----
// Fixed arithmetic calendar: odd months 30 days, even months 29, Zilhaj +1 in leap years.
// Leap years in the 30-year cycle: 2,5,8,10,13,16,19,21,24,27,29.
// Anchored so that 1 Muharram 1448 = 16 June 2026.
const HJ_MONTHS = ["Muharram","Safar","Rabi al-Awwal","Rabi al-Aakhar","Jumada al-Ula","Jumada al-Ukhra","Rajab","Shaban","Ramadan","Shawwal","Zilqad","Zilhaj"];
const HJ_LEAP = new Set([2,5,8,10,13,16,19,21,24,27,29]);
const hjLeapsBefore = (y) => { const n=y-1, c=Math.floor(n/30), r=n%30; let t=c*11; for (const l of HJ_LEAP) if (l<=r) t++; return t; };
const hjYearStart = (y) => 354*(y-1) + hjLeapsBefore(y);
const hjMonthStart = (m) => 30*Math.ceil(m/2) + 29*Math.floor(m/2);
const HJ_ANCHOR_DAYS = hjYearStart(1448);
const HJ_ANCHOR_DATE = Date.UTC(2026,5,16)/864e5;
function toHijri(d, adj = 0){
  const n = Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5) - HJ_ANCHOR_DATE + HJ_ANCHOR_DAYS + adj;
  let y = Math.floor(n/354.36667) + 1;
  while (hjYearStart(y+1) <= n) y++;
  while (hjYearStart(y) > n) y--;
  const doy = n - hjYearStart(y);
  let m = 0; while (m < 11 && doy >= hjMonthStart(m+1)) m++;
  return { y, m: m+1, d: doy - hjMonthStart(m) + 1 };
}
// Edit this list to add or remove occasions: [Hijri month, Hijri day, label]
const BOHRA_OCCASIONS = [
  [1,1,"Hijri New Year"], [1,10,"Ashura"], [2,20,"Arbaeen (Chehlum)"],
  [3,12,"Milad un Nabi"], [7,13,"Wiladat Moula Ali"], [8,15,"Nisf Shaban"],
  [9,1,"Ramadan begins"], [9,21,"Shahadat Moula Ali"], [9,23,"Laylat al-Qadr"],
  [10,1,"Eid ul Fitr"], [12,10,"Eid ul Adha"], [12,18,"Eid-e-Ghadeer"],
];
const hjShow = () => localStorage.getItem("hjOn") !== "0";
const hjAdj = () => parseInt(localStorage.getItem("hjAdj") || "0", 10);
const occasionFor = (h) => (BOHRA_OCCASIONS.find(o => o[0] === h.m && o[1] === h.d) || [])[2];

const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const fmtTime = (t) => { if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"pm":"am"; h=h%12||12; return `${h}${m?":"+pad(m):""}${ap}`; };
const pass = () => localStorage.getItem("calPass") || "";

function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",3500); }

async function api(method, path = "", body){
  const res = await fetch(API + path, {
    method,
    headers: { "x-passcode": pass(), "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { localStorage.removeItem("calPass"); askPass(true); throw new Error("Wrong passcode"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function load(){
  if (!pass()) return askPass();
  try {
    const data = await api("GET");
    events = data.events;
    $("sync").textContent = "· synced " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    render();
  } catch (e) { if (e.message !== "Wrong passcode") toast(e.message); }
}

function askPass(wrong){
  $("passInput").value = "";
  if (!$("login").open) $("login").showModal();
  if (wrong) toast("Wrong passcode");
}
$("loginForm").addEventListener("submit", () => {
  localStorage.setItem("calPass", $("passInput").value);
  setTimeout(load, 0);
});

function eventsOn(dayStr){
  return events
    .filter(e => e.date <= dayStr && dayStr <= e.endDate)
    .sort((a,b) => (a.time||"").localeCompare(b.time||"") || a.title.localeCompare(b.title));
}

function render(){
  let ml = view.toLocaleDateString([], {month:"long", year:"numeric"});
  if (hjShow()) {
    const a = toHijri(new Date(view.getFullYear(), view.getMonth(), 1), hjAdj());
    const b = toHijri(new Date(view.getFullYear(), view.getMonth()+1, 0), hjAdj());
    ml += "\n" + (a.m === b.m ? `${HJ_MONTHS[a.m-1]} ${a.y}` : `${HJ_MONTHS[a.m-1]} – ${HJ_MONTHS[b.m-1]} ${b.y}`);
  }
  $("monthLabel").textContent = ml;
  const grid = $("grid"); grid.innerHTML = "";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => { const c=document.createElement("div"); c.className="dow"; c.textContent=d; grid.appendChild(c); });
  const start = new Date(view); start.setDate(1 - view.getDay());
  const todayStr = ymd(new Date());
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = ymd(d);
    const cell = document.createElement("div");
    cell.className = "cell" + (d.getMonth() !== view.getMonth() ? " other" : "") + (ds === todayStr ? " today" : "");
    const h = hjShow() ? toHijri(d, hjAdj()) : null;
    const hjLabel = h ? (h.d === 1 ? `${h.d} ${HJ_MONTHS[h.m-1]}` : `${h.d}`) : "";
    cell.innerHTML = `<div class="cellhead"><span class="num">${d.getDate()}</span><span class="hj">${hjLabel}</span></div>`;
    if (h) { const oc = occasionFor(h); if (oc) { const o = document.createElement("span"); o.className = "occ"; o.textContent = oc; o.title = oc + " (" + h.d + " " + HJ_MONTHS[h.m-1] + " " + h.y + ")"; cell.appendChild(o); } }
    cell.addEventListener("click", () => openEditor(null, ds));
    eventsOn(ds).forEach(e => {
      const b = document.createElement("button");
      b.className = "ev " + e.who;
      b.textContent = (e.time ? fmtTime(e.time) + " " : "") + e.title;
      b.title = e.title + (e.notes ? "\n" + e.notes : "");
      b.addEventListener("click", (ev) => { ev.stopPropagation(); openEditor(e); });
      cell.appendChild(b);
    });
    grid.appendChild(cell);
  }
  renderUpcoming();
}

function renderUpcoming(){
  const todayStr = ymd(new Date());
  const list = events.filter(e => e.endDate >= todayStr)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.time||"").localeCompare(b.time||"")).slice(0, 8);
  const box = $("upcoming"); box.innerHTML = "";
  if (!list.length){ box.innerHTML = '<div class="empty">Nothing scheduled.</div>'; return; }
  list.forEach(e => {
    const div = document.createElement("div"); div.className = "up";
    const dt = parse(e.date).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
    const range = e.endDate !== e.date ? " – " + parse(e.endDate).toLocaleDateString([], {month:"short", day:"numeric"}) : "";
    div.innerHTML = `<span class="dot" style="background:var(--${e.who.toLowerCase()})"></span><b></b><small></small>`;
    div.querySelector("b").textContent = e.title;
    div.querySelector("small").textContent = `${dt}${range}${e.time ? " · " + fmtTime(e.time) : ""} · ${e.who}`;
    div.addEventListener("click", () => openEditor(e));
    box.appendChild(div);
  });
  if (hjShow()) {
    const occ = []; const t = new Date();
    for (let i = 0; i < 120 && occ.length < 4; i++) {
      const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
      const h = toHijri(d, hjAdj()); const o = occasionFor(h);
      if (o) occ.push({ d, o, h });
    }
    if (occ.length) {
      const hd = document.createElement("h2"); hd.style.marginTop = "16px"; hd.textContent = "Upcoming occasions"; box.appendChild(hd);
      occ.forEach(x => {
        const div = document.createElement("div"); div.className = "up";
        div.innerHTML = "<b class='upocc'></b><small></small>";
        div.querySelector("b").textContent = x.o;
        div.querySelector("small").textContent = x.d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) + " · " + x.h.d + " " + HJ_MONTHS[x.h.m-1] + " " + x.h.y;
        box.appendChild(div);
      });
    }
  }
}

function openEditor(e, dateStr){
  editingId = e ? e.id : null;
  $("dlgTitle").textContent = e ? "Edit event" : "New event";
  $("fTitle").value = e ? e.title : "";
  $("fDate").value = e ? e.date : (dateStr || ymd(new Date()));
  $("fEnd").value = e ? e.endDate : "";
  $("fTime").value = e ? e.time : "";
  $("fEndTime").value = e ? e.endTime : "";
  $("fWho").value = e ? e.who : "Both";
  $("fNotes").value = e ? e.notes : "";
  $("del").style.display = e ? "" : "none";
  $("editor").showModal();
  $("fTitle").focus();
}

$("evForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const body = {
    id: editingId, title: $("fTitle").value, date: $("fDate").value, endDate: $("fEnd").value || $("fDate").value,
    time: $("fTime").value, endTime: $("fEndTime").value, who: $("fWho").value, notes: $("fNotes").value,
  };
  $("save").disabled = true;
  try { await api("POST", "", body); $("editor").close(); await load(); }
  catch (e) { toast(e.message); }
  finally { $("save").disabled = false; }
});
$("del").addEventListener("click", async () => {
  if (!confirm("Delete this event?")) return;
  try { await api("DELETE", "?id=" + encodeURIComponent(editingId)); $("editor").close(); await load(); }
  catch (e) { toast(e.message); }
});
$("cancel").addEventListener("click", () => $("editor").close());
$("add").addEventListener("click", () => openEditor(null));
$("prev").addEventListener("click", () => { view.setMonth(view.getMonth() - 1); render(); });
$("next").addEventListener("click", () => { view.setMonth(view.getMonth() + 1); render(); });
$("today").addEventListener("click", () => { view = new Date(); view.setDate(1); render(); });

$("hjOn").checked = hjShow();
$("hjAdj").value = String(hjAdj());
$("hjOn").addEventListener("change", () => { localStorage.setItem("hjOn", $("hjOn").checked ? "1" : "0"); render(); });
$("hjAdj").addEventListener("change", () => { localStorage.setItem("hjAdj", $("hjAdj").value); render(); });

render();
load();
setInterval(() => { if (!document.hidden && !$("editor").open) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
